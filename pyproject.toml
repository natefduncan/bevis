[project]
name = "bevis"
version = "0.1.0"
description = "Host for auditable reports: prose, charts, and the evidence behind them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "vl-convert-python>=1.7",
]

[project.scripts]
bevis = "bevis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bevis"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "bevis/spec"

[tool.pytest.ini_options]
testpaths = ["tests"]
